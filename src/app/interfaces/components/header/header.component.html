<header class="conex-navbar">
  <div class="navbar-container">
    <!-- Left: Menu Toggle + Brand Logo -->
    <div class="navbar-brand-section">
      <button *ngIf="mostrarBotonMenu" class="sidebar-toggle-btn" (click)="emitToggleSidebar()"
        title="Alternar menú lateral" aria-label="Alternar menú lateral">
        <i class="bi bi-layout-sidebar-inset"></i>
      </button>

      <a routerLink="/home/inicio" class="brand-logo">
        <span class="logo-symbol">
          <i class="bi bi-cpu-fill"></i>
        </span>
        <span class="logo-text">CONEX<span class="logo-accent">.</span></span>
      </a>
    </div>

    <!-- Center: Main Navigation Links -->
    <nav class="navbar-navigation">
      <a routerLink="/home/inicio" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact: true}"
        class="nav-link-item">
        <i class="bi bi-house-door me-1"></i> Inicio
      </a>
      <a routerLink="/home/Store" routerLinkActive="nav-active" class="nav-link-item">
        <i class="bi bi-shop me-1"></i> Tienda
      </a>
    </nav>

    <!-- Right: User Actions + Cart + Auth -->
    <div class="navbar-actions">
      <!-- Cart Icon -->
      <a routerLink="/home/Carrito" class="action-icon-btn cart-btn" title="Ver Carrito de Compras"
        aria-label="Carrito de compras">
        <i class="bi bi-cart3"></i>
      </a>

      <!-- User Logged In: Dropdown -->
      <div class="user-dropdown-wrapper" *ngIf="authService.isLoggedIn()">
        <button class="user-profile-trigger" type="button" id="userMenuButton">
          <div class="user-avatar-circle">
            <i class="bi bi-person-fill"></i>
          </div>
          <span class="username-label d-none d-md-inline">{{ user || 'Mi Cuenta' }}</span>
          <i class="bi bi-chevron-down dropdown-arrow"></i>
        </button>

        <div class="user-dropdown-menu">
          <div class="dropdown-header-info">
            <small class="text-muted d-block">Sesión iniciada</small>
            <strong class="user-display-name">{{ user || 'Usuario' }}</strong>
          </div>
          <hr class="dropdown-divider my-1">
          <a routerLink="/home/Gestion" class="dropdown-link-item">
            <i class="bi bi-grid me-2 text-primary"></i> Panel de Gestión
          </a>
          <a (click)="insertarModificar()" routerLink="/home/modificarUserHeader" class="dropdown-link-item">
            <i class="bi bi-person-gear me-2 text-info"></i> Modificar Datos
          </a>
          <hr class="dropdown-divider my-1">
          <a (click)="logout()" class="dropdown-link-item text-danger logout-link">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
          </a>
        </div>
      </div>

      <!-- User Logged Out: Login CTA -->
      <button class="login-cta-btn" *ngIf="!authService.isLoggedIn()" routerLink="/login">
        <i class="bi bi-person-circle"></i>
        <span>Iniciar Sesión</span>
      </button>
    </div>
  </div>
</header>
