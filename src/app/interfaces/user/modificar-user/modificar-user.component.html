<div class="container my-5">
  <div class="card shadow p-4 mx-auto" style="max-width: 800px">
    <h1 class="text-center mb-4 text-warning">Modificar Usuario</h1>

    <div *ngIf="isLoading" class="alert alert-info text-center" role="alert">
      Cargando usuario...
    </div>

    <form
      *ngIf="usuarioForm && !isLoading"
      [formGroup]="usuarioForm"
      (ngSubmit)="onModify()"
    >
      <!-- DATOS DE LA CUENTA -->
      <fieldset class="border p-3 mb-4 rounded shadow-sm">
        <legend class="float-none w-auto px-2 text-secondary h5">
          Datos de la Cuenta
        </legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="username" class="form-label">Usuario</label>
            <input
              type="text"
              id="username"
              class="form-control"
              formControlName="username"
              readonly
            />
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Correo electrónico</label>
            <input
              type="email"
              id="email"
              class="form-control"
              formControlName="email"
              readonly
            />
          </div>
        </div>
      </fieldset>

      <!-- DATOS PERSONALES -->
      <fieldset formGroupName="persona" class="border p-3 mb-4 rounded shadow-sm">
        <legend class="float-none w-auto px-2 text-secondary h5">
          Datos Personales
        </legend>

        <div class="row g-3">
          <div class="col-md-6">
            <label for="ci" class="form-label">CI</label>
            <input
              type="text"
              id="ci"
              class="form-control"
              formControlName="ci"
              readonly
            />
          </div>

          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input
              type="text"
              id="nombre"
              class="form-control"
              formControlName="nombre"
            />
          </div>

          <div class="col-md-6">
            <label for="apellidoP" class="form-label">Apellido Paterno</label>
            <input
              type="text"
              id="apellidoP"
              class="form-control"
              formControlName="apellidoP"
            />
          </div>

          <div class="col-md-6">
            <label for="apellidoM" class="form-label">Apellido Materno</label>
            <input
              type="text"
              id="apellidoM"
              class="form-control"
              formControlName="apellidoM"
            />
          </div>

          <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              class="form-control"
              formControlName="telefono"
              readonly
            />
          </div>

          <div class="col-md-6">
            <label for="direccion" class="form-label">Dirección</label>
            <input
              type="text"
              id="direccion"
              class="form-control"
              formControlName="direccion"
            />
          </div>

          <div class="col-md-6">
            <label for="ciudad" class="form-label">Ciudad</label>
            <select
              id="ciudad"
              class="form-select"
              formControlName="ciudad"
            >
              <option value="" disabled selected>Seleccione su ciudad</option>
              <option value="Tarija">Tarija</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="pais" class="form-label">País</label>
            <select
              id="pais"
              class="form-select"
              formControlName="pais"
            >
              <option value="" disabled selected>Seleccione su país</option>
              <option value="Bolivia">Bolivia</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
            <input
              type="date"
              id="fechaNacimiento"
              class="form-control"
              formControlName="fechaNacimiento"
              [max]="maxDateAllowed"
            />
          </div>

          <div class="col-md-6">
            <label for="genero" class="form-label">Género</label>
            <select
              id="genero"
              class="form-select"
              formControlName="genero"
            >
              <option value="" disabled>Seleccione su género</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- FOTO DE PERFIL -->
      <div class="mb-4">
        <label for="profileImage" class="form-label">Imagen de Perfil</label>
        <div>
          <input
            type="file"
            id="profileImage"
            class="form-control"
            (change)="onFileSelected($event)"
            accept="image/jpeg, image/png, image/gif"
            aria-describedby="profileImageHelp"
          />
          <small id="profileImageHelp" class="form-text text-muted">
            Formatos: JPG, PNG, GIF. Tamaño máximo: 2MB.
          </small>
        </div>

        <div *ngIf="imageUrl" class="mt-3 text-center">
          <img
            [src]="imageUrl"
            alt="Vista previa"
            class="img-thumbnail rounded-circle"
            style="width: 150px; height: 150px; object-fit: cover"
          />
          <p class="mt-2 text-muted">Imagen actual/nueva</p>
        </div>

        <div *ngIf="!imageUrl && userToModify?.persona?.fotoUrl" class="mt-3 text-center">
          <img
            [src]="userToModify?.persona?.fotoUrl"
            alt="Imagen de perfil existente"
            class="img-thumbnail rounded-circle"
            style="width: 150px; height: 150px; object-fit: cover"
          />
          <p class="mt-2 text-muted">Imagen existente</p>
        </div>

        <div *ngIf="!imageUrl && !userToModify?.persona?.fotoUrl" class="mt-3 text-center">
          <img
            src="https://placehold.co/150x150/cccccc/ffffff?text=Sin+Imagen"
            alt="Sin imagen de perfil"
            class="img-thumbnail rounded-circle"
            style="width: 150px; height: 150px; object-fit: cover"
          />
          <p class="mt-2 text-muted">Sin imagen de perfil</p>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <button
          type="submit"
          class="btn btn-warning btn-lg px-5"
          [disabled]="usuarioForm.pristine || usuarioForm.invalid || isLoading"
        >
          Actualizar
        </button>
        <button
          type="button"
          class="btn btn-secondary btn-lg px-5"
          (click)="goToUserList()"
        >
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <!-- MODAL MENSAJES -->
  <div
    class="modal fade"
    #messageModal
    id="messageModal"
    tabindex="-1"
    aria-labelledby="messageModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div
          class="modal-header"
          [ngClass]="{
            'bg-success text-white': successMessage,
            'bg-danger text-white': errorMessage
          }"
        >
          <h5 class="modal-title" id="messageModalLabel">
            {{ successMessage ? 'Éxito' : 'Error' }}
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="closeMessageModalAndNavigate()"
          ></button>
        </div>
        <div class="modal-body">
          <p *ngIf="successMessage">{{ successMessage }}</p>
          <p *ngIf="errorMessage">{{ errorMessage }}</p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn"
            [ngClass]="{
              'btn-success': successMessage,
              'btn-danger': errorMessage
            }"
            data-bs-dismiss="modal"
            (click)="closeMessageModalAndNavigate()"
          >
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
