<div class="container my-5">
  <div class="card shadow p-4 mx-auto" style="max-width: 800px;">
    <h1 class="text-center mb-4 text-primary">Editar Proveedor</h1>

    <div *ngIf="errorMessage" class="alert alert-danger mb-3">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success mb-3">{{ successMessage }}</div>

    <form [formGroup]="proveedorForm" (ngSubmit)="onSubmit()">

      <!-- Información de la Empresa -->
      <h3 class="mb-3 text-secondary">Información de la Empresa</h3>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="nombreEmpresa" class="form-label">Nombre de la Empresa</label>
          <input id="nombreEmpresa" type="text" class="form-control" formControlName="nombreEmpresa" />
        </div>

        <div class="col-md-6">
          <label for="pais" class="form-label">País</label>
          <select id="pais" class="form-select" formControlName="pais">
            <option value="" disabled>Seleccione el país</option>
            <option value="Bolivia">Bolivia</option>
            <option value="Argentina">Argentina</option>
            <option value="Brasil">Brasil</option>
            <option value="Chile">Chile</option>
            <option value="Perú">Perú</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="ciudad" class="form-label">Ciudad</label>
          <input id="ciudad" type="text" class="form-control" formControlName="ciudad" />
        </div>
        <div class="col-md-6">
          <label for="idCategoria" class="form-label">Categoría</label>
          <select id="idCategoria" class="form-select" formControlName="idCategoria">
            <option value="" disabled>Seleccione una categoría</option>
            <option *ngFor="let cat of categorias" [value]="cat.idCategoria">{{ cat.nombre }}</option>
          </select>
        </div>
      </div>

      <hr>

      <!-- Información de Contacto -->
      <h3 class="mb-3 text-secondary">Información de Contacto</h3>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="nombreContacto" class="form-label">Nombre del Contacto</label>
          <input id="nombreContacto" type="text" class="form-control" formControlName="nombreContacto" />
        </div>
        <div class="col-md-6">
          <label for="emailContacto" class="form-label">Correo Electrónico</label>
          <input id="emailContacto" type="email" class="form-control" formControlName="emailContacto" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="telefonoContacto" class="form-label">Teléfono</label>
          <input id="telefonoContacto" type="tel" class="form-control" formControlName="telefonoContacto" />
        </div>
      </div>

      <div class="mb-4">
        <label for="notas" class="form-label">Notas</label>
        <textarea id="notas" class="form-control" formControlName="notas" rows="3"></textarea>
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <button type="submit" class="btn btn-success btn-lg px-5" [disabled]="proveedorForm.invalid || procesando">
          <span *ngIf="procesando" class="spinner-border spinner-border-sm me-2"></span>
          {{ procesando ? 'Actualizando...' : 'Guardar Cambios' }}
        </button>
        <button type="button" class="btn btn-secondary btn-lg px-5" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Éxito -->
<div class="modal fade" id="modalExito" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="bi bi-check-circle me-2"></i>Actualización Exitosa</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <i class="bi bi-check-circle-fill text-success mb-3" style="font-size: 3rem;"></i>
        <h4 class="mb-3 text-success">¡Cambios guardados!</h4>
        <p>El proveedor fue actualizado correctamente.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" data-bs-dismiss="modal" (click)="redireccionar()">Aceptar</button>
      </div>
    </div>
  </div>
</div>
