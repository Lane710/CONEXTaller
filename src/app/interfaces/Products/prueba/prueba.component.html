<!-- Modal de éxito -->
<div class="modal fade" id="modalExitoCategoria" tabindex="-1" aria-labelledby="modalExitoCategoriaLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="modalExitoCategoriaLabel">
          <i class="bi bi-check-circle me-2"></i> Registro Exitoso
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <i class="bi bi-check-circle-fill mb-3 d-block"></i>
        <h4 class="mb-3">¡Perfecto!</h4>
        <p>La operación se completó correctamente.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success" data-bs-dismiss="modal" (click)="onContinuar()">
          <i class="bi bi-check-lg me-2"></i>Continuar
        </button>
      </div>
    </div>
  </div>
</div>
